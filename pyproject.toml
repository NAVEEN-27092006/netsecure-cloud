[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsecure-cloud"
version = "0.1.0"
description = "A secure, authorized-target availability monitoring dashboard."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "bcrypt>=4.0,<5.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
